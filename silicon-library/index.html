<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>실리콘 서재</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 홈은 품목별 선반에 회사 책등을 꽂은 책장. 책등을 누르면 표지(왼쪽)와 본문 쪽(오른쪽)이 펼쳐진 책 한 권이 열린다. */
:root {
  --bg: #eef1f2; --wall: #e3e8ea; --paper: #fdfdfb; --fg: #18232a; --muted: #5a6a73; --line: #d3dbdf;
  --board: #6b5a4a; --board-edge: #4f4235; --accent: #0b5d72; --accent-soft: #d9ebf0;
  --ok: #1d6b3a; --ok-bg: #dff1e5; --mid: #8a5a00; --mid-bg: #f7ead0; --low: #8c2f39; --low-bg: #f5dfe1;
  --g1: #1f5f6b; --g2: #7a2e33; --g3: #8a6a1f; --g4: #34507a; --g5: #55602b; --g6: #5e3a66; --g7: #8c4a26; --g8: #3f4a50; --g9: #2f5a3d;
  --spine-fg: #fbf8f1;
  --serif: "Noto Serif KR", Georgia, serif; --sans: "IBM Plex Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1518; --wall: #141c20; --paper: #182127; --fg: #e3eaee; --muted: #93a3ac; --line: #28363e;
  --board: #5a4a3c; --board-edge: #3a3028; --accent: #62c4dc; --accent-soft: #173039;
  --ok: #7fd49b; --ok-bg: #173325; --mid: #e6bd62; --mid-bg: #382d12; --low: #ee8f99; --low-bg: #3b1a1f;
  --g1: #2a7584; --g2: #93424a; --g3: #9f7f2e; --g4: #456694; --g5: #6a7637; --g6: #74507d; --g7: #a35d35; --g8: #55626a; --g9: #3d7150;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; }
h1 { font-family: var(--serif); font-size: 1.95rem; line-height: 1.3; margin: 0 0 6px; text-wrap: balance; }
.kicker { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 600; }
.lede { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.chip { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 3px; white-space: nowrap; }
.chip.A { background: var(--ok-bg); color: var(--ok); } .chip.B { background: var(--mid-bg); color: var(--mid); } .chip.C { background: var(--low-bg); color: var(--low); }
.cx { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 3px; border: 1px solid var(--line); background: var(--wall); color: var(--fg); white-space: nowrap; }
.cx.rel { border-style: dashed; }
.cx.chk { border-color: var(--low); color: var(--low); }
.ent-n { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
.rt td.wr, .rt th.wr { white-space: normal; }
.dlist { list-style: none; padding: 0; margin: 0; }
.dlist li { margin: 0 0 9px; line-height: 1.65; }
.ctag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; border: 1px solid var(--line); background: var(--wall); color: var(--muted); white-space: nowrap; margin-left: 4px; }
.ctag.unc { border-style: dashed; color: var(--low); border-color: var(--low); }
.dref { color: var(--muted); font-size: 11px; cursor: help; margin-left: 2px; }
.qd { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.55; }
.vtag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 3px; background: var(--mid-bg); color: var(--mid); white-space: nowrap; margin-left: 4px; }
.vtag.ok { background: var(--ok-bg); color: var(--ok); } .vtag.no { background: var(--low-bg); color: var(--low); } .vtag.wait { background: var(--wall); color: var(--muted); border: 1px solid var(--line); }
.asl { font-size: 12.5px; color: var(--muted); margin: 2px 0 0 18px; padding: 0; }
.rd { font-size: 11.5px; font-weight: 600; }
.dsrc { font-size: 13px; padding-left: 20px; }
.dsrc li { margin-bottom: 6px; }
.deepbox { border: 1px solid var(--line); border-radius: 6px; padding: 4px 16px 10px; margin: 18px 0; background: var(--paper); }
.deepbox > h2 { font-size: 18px; margin: 12px 0 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; margin: 8px 0 4px; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
.tools input, .tools select { font: inherit; font-size: 14px; color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; min-width: 0; }
.tools input { flex: 1 1 220px; }

/* 책장 */
.case { background: var(--wall); border-radius: 6px; padding: 18px 18px 6px; margin-top: 18px; }
.shelf { margin-bottom: 26px; }
.shelf h2 { font-family: var(--serif); font-size: 1.2rem; margin: 0; }
.shelf .cap { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; max-width: 80ch; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; padding: 0 6px; min-height: 40px; border-bottom: 12px solid var(--board); box-shadow: 0 3px 0 var(--board-edge); }
.grp { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 3px; margin-right: 14px; min-width: 0; max-width: 100%; }
.grp-l { writing-mode: vertical-rl; font-size: 11px; letter-spacing: .1em; color: var(--muted); padding: 0 2px 6px; align-self: flex-end; }
.spine { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  width: 44px; padding: 10px 0 8px; border: 0; border-radius: 3px 3px 0 0; color: var(--spine-fg); cursor: pointer; font: inherit;
  box-shadow: inset 3px 0 0 rgba(255,255,255,.14), inset -3px 0 0 rgba(0,0,0,.18); transition: transform .18s ease; }
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spine .t { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; font-size: 14px; letter-spacing: .02em; line-height: 1.1; max-height: 100%; overflow: hidden; }
.spine .i { writing-mode: vertical-rl; font-size: 10.5px; opacity: .85; margin-top: 6px; }
.spine .d { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--spine-fg); margin-top: 8px; flex: none; }
.spine .d.A { background: var(--spine-fg); } .spine .d.B { background: linear-gradient(90deg, var(--spine-fg) 50%, transparent 50%); }
.spine .band { position: absolute; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.35); }
.spine[hidden] { display: none !important; }

/* 펼친 책 */
.bookview { margin-top: 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; background: var(--paper); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: default; }
.spacer { flex: 1; }
.book { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); background: var(--paper); border: 1px solid var(--line); border-radius: 4px 8px 8px 4px; box-shadow: 0 10px 30px rgba(0,0,0,.08); min-height: 560px; }
.cover { position: relative; color: var(--spine-fg); padding: 36px 30px; border-radius: 4px 0 0 4px; display: flex; flex-direction: column; gap: 14px; }
.cover::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 14px; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.22)); }
.cover .series { font-size: 12px; letter-spacing: .1em; opacity: .85; }
.cover h2 { font-family: var(--serif); font-size: 2rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.cover .item { font-size: 15px; border-top: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4); padding: 6px 0; }
.cover .one { font-family: var(--serif); font-size: 15.5px; line-height: 1.6; opacity: .95; }
.cover .head { font-size: 13.5px; opacity: .85; margin-top: -6px; }
.cover .topics { display: flex; flex-wrap: wrap; gap: 6px; }
.cover .topics span { font-size: 12px; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 1px 10px; }
.spine .code { font-size: 9.5px; letter-spacing: .04em; opacity: .8; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
ul.rel { list-style: none; margin-left: 0; }
ul.rel li { margin-bottom: 6px; }
ul.rel a { text-decoration: none; }
.cover .foot { margin-top: auto; font-size: 12.5px; opacity: .85; }
.cover .conf { display: inline-block; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.leaf { padding: 30px 34px 22px; display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; font-size: 13.5px; }
.tabs button { font: inherit; background: none; border: 0; padding: 2px 0; color: var(--muted); cursor: pointer; }
.tabs button[aria-current="page"] { color: var(--fg); font-weight: 600; box-shadow: 0 2px 0 var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { flex: 1; min-width: 0; }
.page.fwd { animation: turnF .32s ease; }
.page.back { animation: turnB .32s ease; }
@keyframes turnF { from { opacity: 0; transform: translateX(28px) rotateY(-8deg); } to { opacity: 1; transform: none; } }
@keyframes turnB { from { opacity: 0; transform: translateX(-28px) rotateY(8deg); } to { opacity: 1; transform: none; } }
/* 책 꺼내기 → 펼치기 → 다시 꽂기 */
.spine.pulling { z-index: 2; animation: pull .42s cubic-bezier(.3,.6,.2,1) forwards; }
@keyframes pull { 0% { transform: translateY(-8px); } 45% { transform: translateY(-46px) rotate(-3deg); } 100% { transform: translateY(-60px) rotate(-6deg) scale(1.25); opacity: 0; } }
.spine.returning { animation: putback .55s cubic-bezier(.2,.8,.2,1); }
@keyframes putback { 0% { transform: translateY(-60px) rotate(-5deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.book { perspective: 1800px; }
.book.opening { animation: rise .35s ease both; }
.book.opening .cover { transform-origin: left center; animation: grow .45s cubic-bezier(.2,.7,.2,1) both; }
.book.opening .leaf { transform-origin: left center; animation: unfold .7s .2s cubic-bezier(.2,.75,.2,1) both; }
.book.opening .cover > * { animation: fadeUp .4s .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(.12); } to { transform: none; } }
@keyframes unfold { from { transform: rotateY(-100deg); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .book.opening .cover { transform-origin: center top; animation-name: growY; }
  .book.opening .leaf { transform-origin: center top; animation-name: unfoldY; }
  @keyframes growY { from { transform: scaleY(.15); } to { transform: none; } }
  @keyframes unfoldY { from { transform: rotateX(80deg); opacity: .2; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  .page.fwd, .page.back, .spine.pulling, .spine.returning, .book.opening, .book.opening .cover, .book.opening .leaf, .book.opening .cover > * { animation: none; }
  .spine { transition: none; }
}
.page h3 { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 10px; }
.page p { margin: 0 0 10px; max-width: 64ch; }
.page ul { margin: 0 0 12px 18px; padding: 0; max-width: 64ch; }
.page li { margin-bottom: 4px; }
dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 4px 0 14px; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; }
.sub-t { margin: -4px 0 10px; color: var(--muted); font-size: 14.5px; letter-spacing: .02em; }
.sec-t { font-family: var(--serif); font-size: 1.3rem; margin: 26px 0 2px; }
.lvrow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; margin: 12px 0; align-items: start; }
.lv { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 3px; margin-right: 8px; vertical-align: 2px; background: var(--ok-bg); color: var(--ok); }
.lv.실무 { background: var(--mid-bg); color: var(--mid); } .lv.심화 { background: var(--low-bg); color: var(--low); }
.lvrow > .lv { margin-top: 10px; text-align: center; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; min-width: 0; }
.pcard { display: grid; gap: 3px; padding: 12px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--fg); position: relative; }
.pcard:hover, .pcard:focus-visible { border-color: var(--accent); outline: none; }
.pcard .pn { position: absolute; right: 12px; top: 10px; color: var(--muted); font-size: 12px; }
.pcard small { color: var(--muted); font-size: 12px; } .pcard span:not(.pn) { font-size: 13.5px; line-height: 1.5; }
.pcard em { font-style: normal; font-size: 12px; color: var(--accent); }
.kchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.kchip { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--fg); background: var(--paper); }
.kchip.p { border-color: var(--accent); color: var(--accent); }
.kchip:hover, .kchip:focus-visible { background: var(--accent-soft); outline: none; }
.hits { margin: 6px 0 12px; font-size: 14px; } .hits .kchips { margin-top: 6px; }
.crumb { font-size: 13px; color: var(--muted); margin: 14px 0 0; } .crumb a { color: var(--accent); }
.ttl { font-family: var(--serif); font-size: 1.6rem; margin: 4px 0 6px; } .ttl small { font-size: 14px; color: var(--muted); font-family: var(--sans); }
.note { font-size: 13px; color: var(--muted); background: var(--accent-soft); padding: 8px 12px; border-radius: 4px; max-width: 72ch; }
.tsec { border-top: 1px solid var(--line); padding: 12px 0 4px; max-width: 900px; } .tsec h3 { font-size: 1.05rem; margin: 0 0 8px; }
.tsec p, .tsec li { max-width: 72ch; }
.steps { padding-left: 1.4em; margin: 0; } .steps li { margin: 3px 0; }
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } .tri.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tri b { font-size: 13px; color: var(--accent); } .tri ul { margin: 4px 0 0; padding-left: 1.1em; font-size: 14px; }
.pnav { display: flex; justify-content: space-between; gap: 10px; margin: 18px 0 30px; } .pnav a { color: var(--accent); font-weight: 600; text-decoration: none; }
@media (max-width: 760px) { .tri, .tri.two { grid-template-columns: 1fr; } .lvrow { grid-template-columns: 1fr; } .lvrow > .lv { justify-self: start; margin-top: 0; } }
.sumbox { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 8px 14px; border-radius: 4px; margin: 0 0 14px; max-width: 72ch; }
.sumbox b { font-size: 13px; color: var(--accent); } .sumbox p { margin: 4px 0; } .sumbox .sm { font-size: 13.5px; color: var(--muted); }
.rt { border-collapse: collapse; width: 100%; max-width: 820px; font-size: 14px; margin: 6px 0 14px; }
.rt th, .rt td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
.rt th { width: 30%; color: var(--muted); font-weight: 600; font-size: 13px; } .rt thead th { width: auto; }
.rt small { color: var(--muted); }
.pflow { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; padding: 0; margin: 8px 0 14px; counter-reset: pf; }
.pflow li a { display: block; font-size: 12.5px; padding: 4px 9px; border-radius: 3px; border: 1px dashed var(--line); color: var(--muted); text-decoration: none; }
.pflow li.on a { border: 1px solid var(--accent); background: var(--accent); color: var(--paper); font-weight: 600; }
.tl { list-style: none; padding: 0; margin: 6px 0 14px; max-width: 76ch; }
.tl li { display: grid; grid-template-columns: 86px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.tl time { color: var(--accent); font-weight: 600; font-size: 13px; } .cite { font-size: 12px; color: var(--muted); }
.stype { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
@media (max-width: 760px) { .tl li { grid-template-columns: 1fr; gap: 2px; } .rt th { width: 36%; } }
.txc { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 0 0 18px; max-width: 64ch; }
.txc h4 { margin: 0 0 6px; font-size: 1.05rem; }
.txc p { margin: 0 0 6px; }
.txc b { color: var(--accent); font-weight: 600; margin-right: 4px; }
.txc ul { margin: 0 0 6px; }
.txr { color: var(--muted); }
.ctx { background: var(--accent-soft); border-radius: 4px; padding: 10px 14px; font-size: 14px; margin: 0 0 12px; max-width: 64ch; }
.empty { color: var(--muted); font-style: italic; }
.src li { font-size: 13.5px; }
/* 조밀한 배치: 리포트는 넓은 화면에서 2열, 표지 그림, 즐겨찾기, 보기 전환, 공정 지도 */
.reps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 18px; }
.rep { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 0; min-width: 0; font-size: 14px; line-height: 1.6; }
.rep li { margin-bottom: 2px; }
.cover .art { width: 100%; max-width: 320px; height: auto; color: #fff; margin-top: 4px; opacity: .92; }
.book.opening .cover .art { animation: fadeUp .6s .5s ease both; }
.spine .star { font-size: 11px; line-height: 1; margin-bottom: 4px; }
.btn.fav[aria-pressed="true"] { border-color: var(--mid); color: var(--mid); }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 6px 0 0; }
.views a { padding: 6px 14px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; background: var(--paper); }
.views a[aria-current="page"] { background: var(--accent); color: var(--paper); }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 16px; counter-reset: st; }
.stage { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 10px; min-width: 0; position: relative; }
.stage.infra { margin-top: 10px; background: var(--wall); }
.st-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.st-h b { font-family: var(--serif); font-size: 1.05rem; }
.st-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--paper); font-size: 12px; font-weight: 700; flex: none; }
.st-en { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
.stage p { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }

.mchip small { font-weight: 400; opacity: .8; font-size: 11px; }

    { id: "f005", scope: "그룹", ent: "c27", text: "린데 그룹의 국내 사업 소개 자료는 타겟(충남 천안) 직원 47명(2024.05 기준)을 가스 사업과 구분해 표기한다. 이 직원 수가 어느 법인 소속인지는 자료에 적혀 있지 않다.", kind: "기업 발표 또는 주장", src: ["lk_kr"], pub: "2024-08-19", asof: "2024-05", checked: "2026-11-02", vs: "부분 검증" },
    { id: "f006", scope: "법인", unit: "linde-amt-chonan", ent: "c27", text: "천안 타겟 사업의 매출·영업이익은 공개자료에서 확인하지 못했다. 린데코리아의 매출(2024년 1조 1,660억 원)은 이 사업장 실적이 아니다.", kind: "확인 불가", src: [], pub: null, asof: null, checked: "2026-11-02", vs: "미검증" },
    { id: "f010", scope: "법인", ent: "c29", text: "S-CAP은 기업용 SSD(eSSD)에 들어가 정전 시 전력을 유지하는 전해 커패시터이며, 삼성 반도체 부문에 2020.11, SK하이닉스에 2024.05 공급을 시작했다고 회사가 밝혔다.", kind: "기업 발표 또는 주장", src: ["shw"], pub: "2024-06-04", asof: "2024-05", checked: "2026-11-02", vs: "검증" },
    { id: "f011", scope: "법인", ent: "c29", text: "한국IR협의회 리포트도 S-Cap을 eSSD용 부품으로 설명하고 삼성전자·SK하이닉스 납품을 기재했다.", kind: "증권사·기관 추정", src: ["sw_kirs"], pub: "2024-09-03", asof: "2024-06", checked: "2026-11-02", vs: "검증" },
    { id: "f012", scope: "법인", ent: "c29", text: "2025년 연결 매출 2,301억 원 중 전해콘덴서 51.5%, Green-Cap 2.4%, 상품·기타 46.1%다(삼화전기 IR을 인용한 리서치 자료).", kind: "증권사·기관 추정", src: ["sw_fin"], pub: "2026-04-14", asof: "2025-12-31", checked: "2026-11-02", vs: "부분 검증" },
    { id: "f013", scope: "법인", ent: "c29", text: "확인한 자료(회사 IR, 리서치 2건)에서 삼화전기 제품을 반도체 제조공정(FAB·P&T)에 투입하는 소재·부품으로 설명한 대목은 찾지 못했다.", kind: "확인 불가", src: [], pub: null, asof: null, checked: "2026-11-02", vs: "미검증" },
    { id: "f014", scope: "법인", ent: "c29", text: "회사 연혁에 '소재부품장비산업 발전 유공 대통령 표창(2023.10)'이 있다. 표창 사실만으로는 제품이 제조공정에 투입되는지 판단할 수 없다.", kind: "기업 발표 또는 주장", src: ["sw_kirs"], pub: "2024-09-03", asof: "2023-10", checked: "2026-11-02", vs: "검증" },
    { id: "f015", scope: "법인", ent: "c29", text: "분류 판단: SSD·서버·자동차 등에 탑재되는 전자부품이므로 공급망 구분을 '관련 산업'으로 둔다. 제조공정 투입 근거가 확인되면 재분류한다.", kind: "편집 분석", src: [], pub: null, asof: null, checked: "2026-11-02", vs: "부분 검증" },
    { id: "f020", scope: "법인", ent: "c22", text: "에이텍솔루션은 한 회사가 모니터링 웨이퍼 재생, MFC 판매, 반도체 부품 정밀세정, 실리콘 부품 공급을 함께 한다고 보도자료에서 밝혔다.", kind: "기업 발표 또는 주장", src: ["at2"], pub: "2025-08-25", asof: "2025-08", checked: "2026-11-02", vs: "검증" },
    { id: "f021", scope: "법인", ent: "c22", text: "재생 웨이퍼와 부품 정밀세정은 별도 법인이 아니라 한 법인의 두 사업으로 본다. 책 목록의 '에이텍솔루션 (세정)'은 같은 법인의 두 번째 사업이다.", kind: "편집 분석", src: ["at2"], pub: null, asof: null, checked: "2026-11-02", vs: "부분 검증" },
    { id: "f022", scope: "법인", ent: "c22", text: "목록의 사업장(천안·아산)과 별개로, 정리 사이트(THE VC)는 본사 소재지를 경기도 화성시 동탄으로 적는다. 본사와 사업장 위치를 구분해 읽어야 하며, 본사 소재지는 1차 자료로 확인하지 못했다.", kind: "확인 불가", src: ["at3"], pub: null, asof: "2026-08", checked: "2026-11-02", vs: "부분 검증" }
    ]

적었던 것을 정정","checked":"본문 전체에서 TSV 수율 서술, 8단에서 TSV 하나 불량 시 9개 다이 폐기, TSV 자가 수리 회로 확인. 저자 소속은 SK hynix(Samsung이 아님)"},"d_hb6":{"t":"Thermal Characterization of HBMs Integrated via Hybrid Bonding (IEEE ECTC 2025) 초록","u":"https://ieeexplore.ieee.org/iel8/11037936/11037952/11038390.pdf","pub":"2025-05-30","type":"학회 논문(초록)","read":"검색 발췌 열람","readAt":"2026-11-02","note":"본문은 구독이 필요해 초록만 확인"},"d_hb7":{"t":"Nomad Semi, Deep Dive on HBM","u":"https://www.nomadsemi.com/p/deep-dive-on-hbm","pub":"2025-06-03","type":"제3자 분석 매체","read":"검색 발췌 열람","readAt":"2026-11-02","note":"정량 주장은 원 출처가 확인되지 않아 근거로 쓰지 않음"},"d_hb8":{"t":"The Elec, Samsung considers applying MUF to server DRAM","u":"https://www.thelec.net/news/articleView.html?idxno=4746","pub":"2024-03-03","type":"언론 보도(익명 소식통)","read":"검색 발췌 열람","readAt":"2026-11-02","note":"익명 소식통 보도이며 회사 확인이 없음"},"d_ts1":{"t":"IEEE EPS, Heterogeneous Integration Roadmap 2024, Chapter 17: Test Technology","u":"https://eps.ieee.org/wp-content/uploads/2025/11/HIR_2024_ch17_Test_Technology.pdf","pub":"2024-11-25","type":"로드맵(IEEE EPS)","read":"원문 열람","readAt":"2026-11-02","note":"","checked":"Memory Test 항목의 KGSD·개별 다이 시험 과제, HBM 시험 방식 서술, 모듈 시험 위치(본문)"},"d_ts2":{"t":"IEEE EPS Test, Heterogeneous Integrated Product Testability Best-Known Methods","u":"https://cmte.ieee.org/eps-test/wp-content/uploads/sites/132/2022/01/IEEE_EPS_Test_Het_Int_Product_Testability_BKM_Final_v1_0-1-14-22-1.pdf","pub":"2022-01-14","type":"기술 가이드(IEEE EPS)","read":"원문 열람","readAt":"2026-11-02","note":"","checked":"프로브 피치 분리, 테스트 패드(40×50μm 알루미늄 패드 예시), 소수 업체 서술, 2014년 직접 마이크로범프 프로빙 경제성 재인용(본문)"},"d_ts3":{"t":"US 7,750,651 B2, Wafer level test probe card (배경 설명)","u":"https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/7750651","pub":"2010-07-06","type":"특허","read":"검색 발췌 열람","readAt":"2026-11-02","note":"특허 배경 설명은 출원인의 서술이며 중립적 검증이 아님. 2010년 특허라 현재 설계와 다를 수 있음. 원문 PDF 조회는 403으로 실패해 검색 발췌만 확인"},"d_ts4":{"t":"Probe Card Technologies in Advanced Semiconductor Testing for Wide Band Gap Devices","u":"https://www.mdpi.com/2674-0729/5/3/18","pub":"2026-07-09","type":"학술논문(리뷰)","read":"원문 열람","readAt":"2026-11-02","note":"광대역 갭 전력반도체 맥락의 분류와 수치","checked":"프로브카드 분류, 중간 병렬 4~16개 사이트·50~200A 서술(본문 전체 수신, 전력반도체 맥락)"},"d_ts5":{"t":"US 8,832,933 B2, Method of fabricating a semiconductor test probe head (배경 설명)","u":"https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/8832933","pub":"2014-09-16","type":"특허","read":"검색 발췌 열람","readAt":"2026-11-02","note":"특허 배경 설명은 출원인의 서술이며 중립적 검증이 아님. 원문 PDF 조회는 403으로 실패해 검색 발췌만 확인"},"d_hb9":{"t":"A Study on the Effectiveness of Underfills in the High Bandwidth Memory with TSV (IMAPS)","u":"https://imapsource.org/article/57356-a-study-on-the-effectiveness-of-underfill-in-the-high-bandwidth-memory-with-tsv.pdf","pub":"2013-09-19","type":"학회 논문","read":"검색 발췌 열람","readAt":"2026-11-02","note":"2013년 초기 HBM 구조 기준"}},"areas":{"dep":{"n":"증착: ALD·CVD·PVD","procs":["dep"],"tx":["pre","gasDep","target"],"intro":"ALD의 자기제한 반응을 중심으로 CVD·PVD와의 차이를 비교합니다.","sections":[{"id":"concept","t":"기본 개념","items":[{"x":"증착은 웨이퍼 위에 절연막·도체막을 원하는 두께와 조성으로 쌓는 공정입니다. 칩은 얇은 막을 겹쳐 만들기 때문에 거의 모든 층이 증착을 거칩니다.","lv":"입문"},{"x":"방식은 크게 셋입니다. PVD는 고체 타겟에서 원자를 물리적으로 떼어 쌓고, CVD는 기체 반응물이 표면 근처에서 반응해 막이 되며, ALD는 그 반응을 두 반쪽으로 쪼개 번갈아 넣습니다.","lv":"입문"},{"x":"ALD는 CVD를 발전시킨 방식으로 설명되며, 기체 전구체를 번갈아 펄스로 넣는 자기제한(self-limiting) 표면 반응에 기반합니다.","lv":"입문","s":["d_ald7"]},{"x":"소자가 작아지면서 종횡비가 큰 3차원 구조가 늘었고, ALD는 자기제한 표면 반응 덕분에 이런 구조에 얇은 막을 입히는 데 가장 적합한 방식의 하나로 꼽힙니다.","lv":"실무","s":["d_ald1"]},{"x":"방식 선택은 '얼마나 깊고 좁은 구조를 덮어야 하는가'와 '얼마나 빨리 쌓아야 하는가'의 교환입니다. 일반적으로 ALD는 균일도에 강하고 느리며, PVD·CVD는 빠르지만 복잡한 형상에서 덮이는 정도가 떨어집니다.","lv":"심화"}]},{"id":"mechanism","t":"동작 원리","items":[{"x":"ALD 한 사이클은 전구체 노출 → 퍼지 → 반응가스 노출 → 퍼지입니다. 첫 반쪽 반응에서 전구체는 완전히 분해되지 않은 채 표면에 결합하고, 표면 종단이 바뀌어 다음 반응물과 반응할 준비가 됩니다.","lv":"입문","s":["d_ald3"]},{"x":"자기제한이란 표면의 반응 자리가 소진되면 반응물을 더 넣어도 더 쌓이지 않는 성질입니다. 이를 확인하려면 도즈(주입량)와 퍼지 시간을 바꿔도 사이클당 성장량(GPC)이 변하지 않는 포화 구간이 있는지 봅니다.","lv":"실무","s":["d_ald4"]},{"x":"정정: '한 사이클에 원자 1층(약 0.1nm)'은 단순화된 표현입니다. 한 리뷰는 알루미나 위 TMA/H₂O ALD에서 반응 자리인 OH기가 nm²당 7~9개인데 사이클당 증착되는 Al 원자는 nm²당 약 4.5개이므로, GPC를 한 단분자층과 같다고 보는 것은 과도한 단순화라고 지적합니다. 이 값은 해당 공정(Al₂O₃, TMA/H₂O)의 전형적 조건에 대한 서술이며 다른 막·전구체로 일반화할 수 없습니다. 서재 '전구체' 해설의 같은 표현은 이에 맞게 고쳤습니다.","lv":"심화","s":["d_ald1"],"q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2019","cond":"Al₂O₃ 열 ALD(TMA/H₂O), 전형적 ALD 조건(온도는 해당 문장에 명시 없음)","cmp":"OH 반응 자리 밀도 대 사이클당 증착 Al 원자 밀도","orig":"리뷰가 '알려져 있다'고 쓴 값이며 인용 원문은 확인하지 않음"},"v":"원문 확인"},{"x":"한 학위논문은 ALD를 표면 반응이 제어하는(surface-controlled) 성장으로, CVD를 공급량(flux)이 제어하는 성장으로 놓고 두 방식의 피복 차이를 비교합니다. 다만 CVD가 언제나 공급 지배인 것은 아니며 조건에 따라 영역이 나뉩니다(바로 아래 문장).","lv":"실무","s":["d_ald6"],"v":"발췌 확인"},{"x":"CVD는 조건에 따라 표면 반응이 속도를 정하는 반응 율속 영역과, 반응물 공급·확산이 속도를 정하는 물질 전달 율속 영역으로 나뉩니다. 반응 율속에서는 구조 안팎의 두께 차가 작고, 물질 전달 율속에서는 입구가 두꺼워지고 깊은 곳이 얇아집니다. 어느 영역에 있는지는 온도·압력·가스 조성에 따라 달라집니다.","lv":"실무"},{"x":"PVD는 원자가 직선으로 날아가는(line-of-sight) 공정이어서 고종횡비 구조에서 피복 균일도를 맞추기 어렵습니다.","lv":"실무","s":["d_ald6"]},{"x":"ALD는 열 ALD, 오존 기반 ALD, 플라즈마 강화 ALD로 나뉘고, 방식에 따라 균일 피복에 영향이 다릅니다. 플라즈마 등 에너지를 더하는 ALD는 반응의 열역학을 바꿔 다른 반응물을 쓸 수 있게 합니다.","lv":"심화","s":["d_ald1","d_ald3"]},{"x":"공정 사이클에 제3의 반응물을 추가한 ABC형 ALD는 증착 화학, 선택성, 성장 속도를 조절할 수 있습니다. 억제제를 먼저 올려 특정 표면의 성장만 막는 영역 선택적 ALD(AS-ALD)가 대표 예입니다.","lv":"심화","s":["d_ald5"]}]},{"id":"materials","t":"핵심 소재·부품·장비","items":[{"x":"전구체는 금속·실리콘을 표면까지 실어 나르는 기체 분자이고, 공반응물은 산소원이나 환원제 역할을 합니다. 전구체와 공반응물이 시간을 나눠 들어가고 사이에 비활성 가스로 퍼지합니다.","lv":"입문","s":["d_ald3"]},{"x":"전구체의 요건: 표면 반응 자리와 반응해야 하고, 반응 뒤에 다음 반쪽 반응이 쓸 수 있는 반응 자리를 남겨야 하며, 휘발성·열안정성·반응성이 모두 충분해야 합니다.","lv":"실무","s":["d_ald4"]},{"x":"반응성과 열안정성은 서로 교환 관계입니다. 열안정성이 높고 반응성이 낮은 전구체를 쓰면 더 반응성 높은 공반응물이 필요해지고, 막 순도와 전구체 가격 사이에서도 사례별 절충이 필요합니다.","lv":"심화","s":["d_ald6"]},{"x":"전구체가 비쌀수록 사용 효율이 중요해져, 반응기 부피를 줄이고 과다 주입을 피하는 설계가 쓰입니다.","lv":"실무","s":["d_ald4"]},{"x":"전구체 열안정성은 새 재료 개발의 제약이 됩니다. MoS₂ ALD 연구에서는 기존 Mo 전구체의 열안정성 한계가 결정성 높은 막을 얻는 데 걸림돌이었고 더 열안정적인 전구체가 필요하다고 결론냈습니다.","lv":"심화","s":["d_ald7"]},{"x":"장비와 부품: ALD·CVD·PECVD 반응기(매엽식·배치식), PVD 스퍼터, 가스 공급계(MFC·밸브·기화기), 히터·서셉터, 샤워헤드, 진공펌프. PVD의 원료는 고순도 금속 타겟입니다.","lv":"실무"}]},{"id":"params","t":"주요 공정 변수","items":[{"x":"ALD에서 먼저 보는 변수는 전구체 도즈, 퍼지 시간, 기판 온도, 압력, 공반응물 종류(열/플라즈마)입니다. 도즈와 퍼지를 늘려도 GPC가 변하지 않는 구간이 공정 창입니다.","lv":"실무","s":["d_ald4"]},{"x":"한 논문의 서론은 ALD의 자기제한 반응이 비교적 낮은 온도(일반적으로 100~400℃)에서 고품질 막을 허용하는 경우가 많다고 일반화해 서술합니다. 이 범위는 개별 공정의 보장 범위가 아닙니다. 같은 논문의 자체 MoS₂ ALD(Mo(thd)₃+H₂S)는 자기제한 성장이 250~325℃에서만 나타났고 300℃를 최적으로 썼으며, 350~400℃에서는 전구체 분해가 보여 순수 ALD 조건이 아니었습니다.","lv":"실무","s":["d_ald7"],"q":{"t":"원논문 실험","v":"원문 확인","yr":"2017","cond":"MoS₂ ALD, Mo(thd)₃+H₂S, 유동형 F-120 반응기 약 5mbar, 250~400℃ 탐색, 실리콘 기판","cmp":"서론의 100~400℃ 일반 서술 대 본 공정의 250~325℃ 자기제한 구간","orig":"서론의 100~400℃는 논문이 인용한 일반 서술이며 인용 원문은 확인하지 않음"},"v":"원문 확인"},{"x":"GPC는 사이클당 두께(nm 또는 Å)로 표시하며, 두께는 GPC × 사이클 수로 정해져 옹스트롬 수준의 두께 제어가 가능합니다.","lv":"실무","s":["d_ald6","d_ald2"]},{"x":"Conformality(균일 피복)는 구조 안쪽 두께와 바깥쪽 두께의 비입니다. step coverage는 측벽 중간 또는 바닥 두께 대 상단 두께의 비(%)로 정의하며 PVD·PECVD에서 주로 쓰는 말입니다. 리뷰는 PVD·(PE)CVD에서 어려운 종횡비 5:1 정도의 구조를 ALD는 보통 100% 덮는다고 서술하며, 그래서 ALD 평가에는 더 까다로운 측정 구조가 필요합니다. 이것은 일반적 서술이며 모든 조건에서 균일 피복을 보장한다는 뜻이 아닙니다.","lv":"심화","s":["d_ald1"],"q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2019","cond":"step coverage 정의와 'EAR 5:1은 ALD가 보통 100%' 서술. 측정 구조에 따라 달라짐","cmp":"PVD·(PE)CVD에서 어려운 5:1 구조 대 ALD","orig":"리뷰가 인용한 원 논문은 열람하지 않음"},"v":"원문 확인"},{"x":"ALD라도 피복은 조건에 따라 크게 달라집니다. 한 리뷰가 문헌을 정리한 표에서, 같은 TMA/H₂O 공정의 보고된 피복 가능 종횡비(coated EAR)가 구조와 공정 조건에 따라 5:1에서 1750:1까지 크게 달랐습니다. 열 ALD의 극단 사례는 7000:1이었고, 오존 기반 Al₂O₃는 20:1, 플라즈마 강화 ALD 산화물은 최대 30:1로 보고되어 라디칼의 표면 재결합이 피복을 제한한다고 설명합니다. 노출이 부족하면 깊이에 따른 두께 프로파일이 생기고, CVD성 반응이 섞이면 입구 두께가 과다해질 수 있습니다(시뮬레이션에서 입구 약 160%).","lv":"심화","s":["d_ald1"],"v":"원문 확인","q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2019","cond":"문헌 보고값을 표 II~IV로 정리. 극단 7000:1은 양극 산화 알루미나(AAO) 구조 사례. 160%는 EAR 50:1 정사각 홀의 3D 몬테카를로 시뮬레이션","cmp":"열 ALD 대 오존 기반 대 플라즈마 강화 ALD","lim":"보고된 최고값이며 양산 보장값이 아님. 구조·공정 조건이 보고마다 다름","orig":"표의 원 논문들은 열람하지 않음"}},{"x":"증착이 진행되며 구조의 유효 종횡비가 커져 전구체 확산이 더 막히므로, 사이클 수가 늘수록 깊은 곳의 포화가 어려워집니다.","lv":"심화","s":["d_ald1"]},{"x":"PVD는 파워·압력·타겟-기판 거리가, CVD는 온도·압력·가스 유량·(PECVD의 경우) 플라즈마 파워가 핵심 관리 항목입니다. 구체적 수치는 막과 장비마다 달라 일반화하지 않습니다.","lv":"실무"}]},{"id":"defects","t":"품질·불량 메커니즘","items":[{"x":"고종횡비 기판에서는 깊이 들어갈수록 증착 속도가 줄어 이음매(seam)나 빈 공간(void)이 생길 수 있습니다. 원인은 구조 안쪽으로 들어가는 전구체 분자의 확산 제한, 또는 자기제한이 아닌 기생 CVD 반응입니다.","lv":"심화","s":["d_ald5"]},{"x":"ALD 공정 창 안에서도 식각 반응이 GPC를 낮출 수 있어서, 성장은 늘 일정하다고 가정하면 안 됩니다.","lv":"심화","s":["d_ald6"]},{"x":"전구체 리간드가 덜 빠지면 탄소·할로겐 같은 불순물이 막에 남습니다. 막 조성은 XPS, RBS 같은 분석으로 확인합니다.","lv":"실무","s":["d_ald4"]},{"x":"PVD는 직진성 때문에 구멍 입구에 막이 먼저 쌓여 안쪽이 비는 현상(오버행)이 대표 불량입니다.","lv":"실무","s":["d_ald6"]},{"x":"TSV처럼 종횡비 10 이상인 구조에서는 PVD·CVD가 한계에 이르고 일정 종횡비를 넘으면 ALD만이 고품질 피복을 줄 수 있다고 보고됩니다. 한 연구는 열 ALD로 TaN 계열 배리어 약 6nm와 Ru 시드 약 9nm를 올려 종횡비 10~12의 TSV를 도금했습니다.","lv":"심화","s":["d_ald8"],"q":{"t":"원논문 실험","v":"발췌 확인","yr":"2019","cond":"300mm 웨이퍼, 열 ALD TaxNy 약 6nm + Ru 약 9nm 후 Cu 전기도금, TSV 종횡비 10~12","cmp":"TaxNy 배리어+ALD Ru 시드 대 TixNy 배리어+i-PVD Cu 시드","orig":"초록의 검색 발췌만 확인(유료 본문 미열람)"},"v":"발췌 확인"},{"x":"공통 불량: 막 응력으로 인한 웨이퍼 휨, 챔버 벽·샤워헤드에서 떨어진 막 조각에 의한 파티클. 이를 줄이는 방법은 챔버 세정 주기와 부품 관리에 달려 있습니다.","lv":"실무"}]},{"id":"trend","t":"기술 발전 방향","items":[{"x":"영역 선택적 증착(AS-ALD)은 표면 성질 차이로 특정 영역에서만 막이 자라게 해, 패터닝 단계를 줄이려는 시도입니다. 억제제 단계(A)를 두는 ABC형 사이클이 한 방법으로 연구되고 있습니다.","lv":"심화","s":["d_ald5"]},{"x":"깊은 구조에서 균일도를 높이기 위해 사이클 구성(추가 반응물 단계)을 조절하는 연구가 진행됩니다. 한 연구는 SiN을 ABC형 ALD로 올려 고종횡비 구조에서의 피복을 개선하는 방법을 제안했습니다.","lv":"심화","s":["d_ald5"]},{"x":"서재의 전구체 품목군 해설은 몰리브덴(Mo)을 3D NAND 워드라인에서 텅스텐을 대체하기 시작한 신규 금속 전구체로 소개합니다. 이 내용은 기존 해설을 옮긴 것이며 이번 PR에서 원문을 다시 대조하지 않았습니다.","lv":"산업","c":"불확실"},{"x":"ALD는 CVD보다 낮은 온도에서 가능한 경우가 많아, 온도에 민감한 재료·구조와의 집적에 유리하다는 점이 장점으로 꼽힙니다.","lv":"실무","s":["d_ald3"]}]},{"id":"industry","t":"산업·기업 연계","items":[{"x":"증착 공급망은 증착 장비, 소재(전구체·특수가스·타겟), 부품(히터·샤워헤드·실·밸브)으로 나뉩니다. 소재·부품은 공정마다 승인(퀄) 절차를 거쳐 들어갑니다.","lv":"산업"},{"x":"서재의 덕산테코피아 책은 HCDS를 합성부터 정제까지 일괄 국산화한 실리콘 전구체로, 저온 SiN·SiO₂·SiON 증착에 쓰이고 DRAM과 NAND에 적용된다고 회사 자료를 인용해 소개합니다.","lv":"산업","s":["dst"]},{"x":"서재의 레이크머티리얼즈 책은 반도체 High-k 전구체 양산을 천안 사업장에서 수행한다고 회사 자료를 인용해 소개합니다. 'TMA 글로벌 4개 공급사 중 하나'는 회사 주장입니다.","lv":"산업","s":["lake"]},{"x":"스퍼터링 타겟은 서재에서 린데와 Solstice 책이 다룹니다. 린데 책의 천안 타겟 사업장은 Linde AMT Chonan Co., Ltd.이며 린데코리아와는 법인명이 다르다는 점을 공식 사이트에서 확인했습니다.","lv":"산업","s":["lk_amt"]},{"x":"고객사, 공급 관계, 시장점유율은 확인된 자료가 없어 서술하지 않습니다.","lv":"산업","c":"불확실"}]}],"unc":[{"x":"영역 선택적 증착과 Mo 전구체의 양산 적용 시점은 이번에 확인하지 못했습니다.","lv":"심화","c":"불확실"},{"x":"PVD·CVD의 정량 비교(속도·균일도)는 이번 조사에서 1차 출처를 확보하지 못해 정성 설명만 했습니다.","lv":"심화","c":"불확실"},{"x":"PE-ALD와 열 ALD의 구체 장비·소재 사양은 다루지 않았습니다.","lv":"심화","c":"불확실"}]},"etch":{"n":"식각 및 세정","procs":["etch","clean"],"tx":["gasEtch","etch","sisic","quartz","oring","upw","clean"],"intro":"식각의 선택비·이방성·ARDE와 세정의 입자·금속 제거를 묶어 설명합니다.","sections":[{"id":"concept","t":"기본 개념","items":[{"x":"식각은 마스크가 덮지 않은 막을 선택적으로 제거해 패턴을 실제 구조로 옮기는 공정이고, 세정은 공정 사이사이 입자·금속·유기물·자연산화막을 제거해 다음 공정의 바탕을 만드는 공정입니다.","lv":"입문"},{"x":"식각은 플라즈마를 쓰는 건식과 약액을 쓰는 습식으로 나뉩니다. 건식은 방향성(이방성)을 만들 수 있고 습식은 모든 방향으로 녹이는(등방성) 대신 선택비가 높은 경우가 많습니다.","lv":"입문"},{"x":"이방성은 수평 방향 식각량이 수직 방향 식각량에 비해 얼마나 작은지로 정의합니다. 한 리뷰는 사이클당 식각량(EPC)으로 A = (EPCv − EPCh) / EPCv 라고 씁니다. 1에 가까울수록 수직으로만 깎입니다.","lv":"실무","s":["d_et1"],"v":"원문 확인"},{"x":"한 리뷰는 최첨단 고종횡비 플라즈마 식각에서 목표 종횡비가 100에 가까워질 수 있고, 그러려면 이방성이 1에 아주 가까워야 하며 초고 이온 에너지와 정밀한 화학 제어가 필요하다고 서술합니다. 이는 저자들의 일반 서술이며 개별 공정의 실측값이 아닙니다.","lv":"심화","s":["d_et1"],"q":{"t":"논문 서술","v":"원문 확인","yr":"2021","cond":"최첨단 플라즈마 HAR 공정의 목표를 서술한 문장(실험값 아님)"},"v":"원문 확인"},{"x":"전통적 RCA 세정은 SC1(암모니아+과산화수소) 단계 뒤에 SC2(염산+과산화수소) 단계가 붙는 구성입니다. 이후 공정에 따라 묽은 불산(DHF)이나 황산계 SPM이 앞뒤에 더해집니다.","lv":"실무","s":["d_cl2","d_cl3"],"lim":"오래된 자료(2001년, 2009년)이며 현재 양산 조건·설계와 다를 수 있음"}]},{"id":"mechanism","t":"동작 원리","items":[{"x":"플라즈마 식각에서 이온은 방향성을 주는 물리적 역할을, 라디칼은 막과 반응하는 화학적 역할을 하고, 둘이 함께 작용해 수직 측벽을 만듭니다.","lv":"입문"},{"x":"폴리머화가 강한 HFC 계열 가스는 표면에 보호성 고분자층을 만들어 마스크 선택비를 높입니다. 한 연구(산화막/질화막 교대 적층(ON) 식각, C₃HF₅ 등 HFC 가스 6종 비교 실험)에서는 (F−H)/C 비가 커질수록 마스크 선택비가 낮아졌습니다.","lv":"심화","s":["d_et4"]},{"x":"SiO₂와 SiN은 같은 가스에서도 다르게 반응합니다. CF 이온의 식각 수율은 SiO₂에서는 F 이온보다 크고 SiN에서는 작아, 탄소가 SiO₂ 식각은 돕고 SiN 식각은 억제합니다. 그래서 산화막/질화막 교대 적층(ON) 식각에서는 SiN 식각이 속도를 제한했습니다.","lv":"심화","s":["d_et4"]},{"x":"ARDE(종횡비 의존 식각)의 원인으로, 한 시뮬레이션 연구(SiO₂를 CHF₃/Ar·CF₄/Ar 플라즈마로 식각한 실험과 다중 스케일 모델링, 계측 마크·BEOL 규모 피처 중심)는 중성종의 그림자 효과와 확산 반사를 주된 기구로 제시했습니다. 같은 연구의 실험에서는 종횡비 1 부근에서 식각 속도가 극대가 되는, 정·역 RIE lag이 함께 나타나는 조건도 확인됐습니다.","lv":"심화","s":["d_et3"]},{"x":"열 식각에서는 고종횡비 구조 안의 가스 분자 수송이 식각 속도를 제한해 ARDE를 일으킬 수 있습니다.","lv":"심화","s":["d_et1"]},{"x":"원자층 식각(ALE)은 표면 개질 → 제거를 반복하는 자기제한 순차 반응입니다. 열 ALE는 등방적이고, 방향성 ALE는 이온으로 개질된 층을 제거합니다. 플라즈마 ALE에서는 입자 에너지가 정밀도를 결정하는 핵심 요소입니다.","lv":"심화","s":["d_et1","d_et2"],"lim":"개념 서술. 구체 식각률·선택비는 재료·장비·조건별 실험값이라 일반화하지 않음"},{"x":"SC1에서는 과산화수소의 산화와 암모니아의 식각이 연속해 일어나 입자 밑을 파고들어 떨어뜨립니다(입자가 undercut되어 lift-off). ECS 논문집(PV 94-07)에 실린 한 실험은 열산화막 식각 깊이에 대한 입자 제거 효율을 측정해, 입자 제거 효율이 식각 속도가 아니라 식각된 깊이에 의존하며 1.5~2nm가 식각되자 0.80~0.90에 이르렀다고 보고합니다.","lv":"실무","s":["d_cl1"],"q":{"t":"원논문 실험","v":"원문 확인","yr":"1994","cond":"NH₄OH/H₂O₂/H₂O 3종 혼합(0.25/1/5·0.05/1/5·0.01/1/5) 70℃, 열산화막 식각률 0.2~0.05nm/min, HF-last 방식으로 오염시킨 웨이퍼, 입자 크기 LSE>0.5μm 계수","cmp":"식각 깊이별 입자 제거 효율(혼합비 3종 비교)","lim":"1990년대 실험실 조건(권 번호 기준 추정). 현재 양산 세정 공정의 표준 성능으로 일반화하지 않음","orig":"논문 저자는 확인하지 못함"},"v":"원문 확인","lim":"1990년대 실험실 조건. 현재 양산 공정의 표준 성능이 아님"},{"x":"묽은 불산으로 자연산화막을 벗기면 표면이 소수성이 되어, 반대 전하의 입자를 강하게 끌어당기고 유기 오염에도 민감해집니다. 그래서 약액을 입자 없이 유지해야 합니다.","lv":"실무","s":["d_cl3"],"lim":"오래된 자료(2009년)이며 현재 양산 조건·설계와 다를 수 있음"}]},{"id":"materials","t":"핵심 소재·부품·장비","items":[{"x":"가스: 불화가스(CF₄, C₄F₆, C₄F₈, NF₃, SF₆ 등)와 Cl₂, HBr. 약액: 질화막용 인산, 산화막용 HF·BOE, 세정용 SC1·SC2·IPA와 초순수. 서재의 '식각·세정용 불화가스', '고선택비 식각액' 해설과 연결됩니다.","lv":"실무"},{"x":"챔버 안 플라즈마에 노출되는 부품(포커스 링·샤워헤드의 Si·SiC, 쿼츠, 정전척, FFKM O-링)은 식각이 강해질수록 소모가 빨라져 교체 주기와 파티클 발생이 문제가 됩니다. 이 부분은 이번에 1차 출처를 확보하지 못해 일반 원리로만 적었습니다.","lv":"실무"},{"x":"점 사용(point-of-use) 여과는 세정 약액의 오염을 낮추는 수단이고, 필터는 화학 호환성과 입자 포집, 이온 순도가 요구됩니다.","lv":"실무","s":["d_cl3"],"lim":"오래된 자료(2009년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"장비: CCP 식각기(산화막·고종횡비), ICP 식각기(실리콘·금속), 매엽식/배치식 세정기, 스크러버, ALE 장비.","lv":"실무"},{"x":"세정에서 매엽식 장비 전환은 2001년 자료가 pre-gate 세정을 배치식에서 매엽식으로 바꾸는 추세로 전망했습니다. 현재 점유는 확인하지 못했습니다.","lv":"심화","s":["d_cl2"],"c":"전망","lim":"2001년 자료의 전망. 현재 점유는 확인하지 못함"}]},{"id":"params","t":"주요 공정 변수","items":[{"x":"식각의 핵심 지표: 식각률, 선택비(깎을 막과 남길 막의 속도 비), 이방성, 균일도(웨이퍼·다이·ARDE), 프로파일(CD·측벽 각), 마스크 손실. 단위와 목표값은 막과 세대마다 다릅니다.","lv":"실무"},{"x":"조절 노브: 이온 에너지(바이어스), 압력, 가스 조성·유량, 온도(극저온 포함), ALE에서는 사이클 구성. ALE에서 입자 에너지가 정밀도의 핵심입니다.","lv":"실무","s":["d_et2"]},{"x":"가스 조성만으로도 속도와 마스크 선택비가 함께 움직이므로, 식각 속도만 높이는 선택은 마스크 손실을 키울 수 있습니다.","lv":"심화","s":["d_et4"]},{"x":"세정 변수: 약액 농도·온도·시간, 산화막 식각 깊이, 헹굼·건조 방식. 입자 제거는 식각된 산화막 깊이가 결정 변수였다는 점에서 단순히 온도·시간을 올리는 것이 답이 아닙니다.","lv":"실무","s":["d_cl1"],"lim":"오래된 자료(1994년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"금속 오염은 단위 면적당 원자 수(atoms/cm²)로 표면 농도를 관리합니다.","lv":"실무","s":["d_cl2"],"lim":"오래된 자료(2001년)이며 현재 양산 조건·설계와 다를 수 있음"}]},{"id":"defects","t":"품질·불량 메커니즘","items":[{"x":"종횡비가 커지면 식각 속도가 떨어지는 ARDE는 식각의 대표 문제입니다. 한 리뷰(Fig. 4b 설명)는 7nm 노드 로직 low-k 식각에서 연속파 플라즈마 식각의 RIE lag이 약 11.9nm인 반면 준-ALE(QALE)에서는 약 1.3nm로 줄었다고 적으며 원 논문(Lutker-Lee 외, 2019)을 인용합니다. 이 값은 해당 구조·공정 조건의 사례이며 ALE 일반의 성능이 아닙니다.","lv":"심화","s":["d_et2"],"q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2026","cond":"7nm 노드 로직 low-k 유전체 식각, 서로 다른 피처 크기에서의 식각 깊이 차(RIE lag 매크로) 비교","cmp":"연속파 플라즈마 식각 대 준-ALE(QALE)","lim":"단일 사례의 보고값. ALE 일반 성능이나 양산 표준이 아님","orig":"인용 원 논문(JVST A 37:011001, 2019)은 열람하지 않음"},"v":"원문 확인"},{"x":"고종횡비 식각의 대표 불량: 구멍 휨, 입구 막힘, 바닥 미식각, 선택비 부족에 의한 마스크 소진. 3D NAND에서는 수십 개의 오버행과 리세스가 반응종의 경로를 복잡하게 만듭니다.","lv":"심화","s":["d_et1"]},{"x":"플라즈마 손상과 잔류물: 방향성 식각은 이온 충돌 손상을 남길 수 있고, 열 ALE는 표면 침식 없이 잔류물 없는 제거가 가능하다고 설명됩니다.","lv":"심화","s":["d_et1"]},{"x":"침지식 RCA 세정에서는 금속 오염이 약액에 쌓일 수 있고, 한 연구는 이를 줄인 방식에서 게이트 산화막 절연 특성이 개선됐다고 보고했습니다(2001년 자료).","lv":"실무","s":["d_cl2"],"lim":"2001년 자료. 현재 양산 세정 성능으로 일반화하지 않음","v":"발췌 확인"},{"x":"패턴 붕괴(leaning)는 고종횡비 패턴이 건조 중 모세관력으로 쓰러지는 불량이고, 초임계 건조가 대응책으로 쓰입니다(기존 해설 내용, 이번 PR에서 출처 확보 안 됨).","lv":"실무"}]},{"id":"trend","t":"기술 발전 방향","items":[{"x":"ALE는 자기제한 순차 반응으로 식각 균일도를 높이고 ARDE를 줄이는 것을 목표로 연구됩니다. 열 ALE는 반응종 수송이 속도를 제한하는 문제를 피할 수 있습니다.","lv":"심화","s":["d_et1"]},{"x":"무손상·정밀 제거가 요구되는 재료(SiC, GaN 등)에서도 ALE가 대안으로 검토됩니다.","lv":"심화","s":["d_et2"],"c":"전망"},{"x":"극저온 식각, GAA 구조용 선택 식각은 기존 해설이 다룬 방향이며, 이번에 별도 출처를 확보하지 못했습니다.","lv":"심화","c":"불확실"}]},{"id":"industry","t":"산업·기업 연계","items":[{"x":"공급망: 식각 장비, 가스·약액, 챔버 소모 부품, 부품 정밀세정·코팅·재생, 초순수 설비로 나뉩니다. 공정이 거칠어질수록 소모 부품과 가스의 승인 절차가 중요해집니다.","lv":"산업"},{"x":"서재 책 중 식각·세정 소재와 부품을 다루는 곳은 아래 표의 기업입니다. 연결은 품목 단위이며 공급 상대와 점유율을 뜻하지 않습니다.","lv":"산업"},{"x":"에이텍솔루션은 한 법인이 재생 웨이퍼와 반도체 부품 정밀세정 사업을 함께 한다고 보도자료에서 밝혔습니다.","lv":"산업","s":["at2"]}]}],"unc":[{"x":"챔버 소모 부품(Si·SiC·쿼츠·FFKM)의 소모·파티클 정량 근거는 확보하지 못했습니다.","lv":"심화","c":"불확실"},{"x":"세정 조건 수치(농도·온도)는 연구실 절차나 오래된 자료뿐이어서 양산 조건으로 일반화하지 않았습니다.","lv":"실무","c":"불확실"},{"x":"ALE의 양산 적용 범위는 리뷰 수준의 정보만 확인했습니다.","lv":"심화","c":"불확실"}]},"cmp":{"n":"CMP","procs":["cmp"],"tx":["cmp"],"intro":"제거율·선택비·디싱/에로전·결함을 함께 놓고 CMP의 교환 관계를 설명합니다.","sections":[{"id":"concept","t":"기본 개념","items":[{"x":"CMP(화학적 기계적 평탄화)는 화학 반응으로 표면을 무르게 하고 연마 입자와 패드로 깎아 웨이퍼를 평평하게 만드는 공정입니다. 층이 쌓일수록 굴곡이 커져 다음 노광의 초점이 어긋나고, 금속을 홈 안에만 남기는 다마신 배선에도 필수입니다.","lv":"입문"},{"x":"CMP는 FEOL·MOL·BEOL 전반에서 쓰이며, 공정마다 필요한 제거율, 선택비, 평탄도가 다릅니다. 소자가 작아질수록 막별로 정밀하게 조절된 선택적 연마가 더 중요해집니다.","lv":"실무","s":["d_cm1"]},{"x":"CMP 품질은 크게 네 가지로 봅니다. 제거율, 선택비, 평탄도(디싱·에로전), 결함입니다. 한 지표를 올리면 다른 지표가 나빠지는 교환 관계가 흔합니다.","lv":"실무"},{"x":"하이브리드 본딩에서는 Cu 디싱(Cu 리세스)을 수 nm 수준으로 낮춰야 하는 등 CMP 요구가 훨씬 엄격해집니다.","lv":"심화","s":["d_cm4"],"v":"발췌 확인"}]},{"id":"mechanism","t":"동작 원리","items":[{"x":"회전하는 패드 위에 웨이퍼를 눌러 대고 슬러리를 흘립니다. 슬러리의 화학 성분이 표면을 약하게 만들고 연마 입자가 그 층을 깎아내며, 패드 컨디셔너가 패드 표면을 계속 되살립니다.","lv":"입문"},{"x":"Preston 식은 MRR = K·P·V (K 프레스톤 계수, P 웨이퍼에 가해진 압력, V 패드-웨이퍼 상대 속도)로, 초기 유전체 제거율을 잘 설명했습니다. K는 마찰력과 화학 등 여러 요인에 의존합니다.","lv":"실무","s":["d_cm1","d_cm2"]},{"x":"Preston 식만으로는 부족합니다. 연마가 진행되며 실제 접촉 면적 비가 줄어 제거율이 떨어지고, 화학 반응과 기계 작용이 서로 영향을 주기 때문입니다.","lv":"심화","s":["d_cm1"]},{"x":"금속 CMP는 표면에 약한 막(산화막·부동태막)을 만들고 그 막을 기계적으로 벗겨내는 방식입니다. 막이 만들어지는 속도가 제거율을 제한할 수 있습니다.","lv":"심화","s":["d_cm7"]},{"x":"Cu에서는 BTA 계열 부동태제가 구리 표면에 고분자성 보호막을 만든다고 설명됩니다. 마찰과 화학 반응으로 접촉 계면 온도가 올라가는 점도 고려 대상입니다.","lv":"심화","s":["d_cm1"]},{"x":"텅스텐 접점 CMP 사례: 벌크 단계에서 선택비가 높은 슬러리로 종점 검출까지 깎아 산화막을 노출시킨 뒤, 선택비가 낮은 슬러리로 버프 단계를 거쳐 목표 두께를 맞춥니다.","lv":"실무","s":["d_cm5"]},{"x":"연마 뒤에는 입자와 유기 잔류물을 제거하는 후세정이 필수입니다.","lv":"실무","s":["d_cm1"]}]},{"id":"materials","t":"핵심 소재·부품·장비","items":[{"x":"슬러리는 연마 입자(실리카·세리아·알루미나)와 산화제·착화제·부동태제·pH 조절제로 구성됩니다. 연마 대상 막마다 배합이 다릅니다.","lv":"실무"},{"x":"패드는 미세 기공과 그루브로 슬러리를 붙잡아 두는 폴리우레탄계 소모품이고, 컨디셔너는 패드 표면 거칠기를 유지합니다. 패드와 후세정 브러시 자체도 결함 발생원이 될 수 있습니다.","lv":"실무","s":["d_cm6"]},{"x":"장비는 연마부와 후세정부가 통합된 구조이며, 종점 검출(광학·모터 전류)이 정지 시점을 정합니다.","lv":"실무","s":["d_cm5"]},{"x":"Cu와 배리어의 제거 선택비는 디싱 방향을 가릅니다. 선택비에 따라 Cu가 움푹 들어가거나(dished) 튀어나옵니다.","lv":"심화","s":["d_cm4"]}]},{"id":"params","t":"주요 공정 변수","items":[{"x":"대표 조절 변수: 압력(다운포스), 상대 속도, 슬러리 종류·유량·pH, 패드 종류와 컨디셔닝. 높은 압력은 제거량을 키우고 낮은 압력은 다양한 패턴 밀도에서 균일한 표면을 만드는 데 유리하다고 정리됩니다.","lv":"실무","s":["d_cm4"]},{"x":"Cu/배리어 선택비는 디싱과 배리어 손실을 모두 피하려고 1:1 근처로 정하는 경우가 많습니다. 한 연구의 서론은 보고된 [배리어:Cu] 선택비가 약 0.3~3.0 범위에서 다양하다고 정리합니다.","lv":"심화","s":["d_cm7"],"q":{"t":"논문 서술","v":"원문 확인","yr":"2024","cond":"Mo/Cu CMP 연구(약알칼리 시트르산계 슬러리)의 서론 서술. 선택비는 보통 블랭킷 웨이퍼 제거율로 설정됨","cmp":"보고된 선택비 범위 약 0.3~3.0과 1:1 선택"},"v":"원문 확인"},{"x":"디싱은 선폭에 크게 좌우됩니다. MIT 학위논문(2001) 5장은 중성 pH 슬러리(α-Al₂O₃ 300nm 4vol%, 48kPa, 0.7m/s, Rodel IC-1400, 100mm 웨이퍼, Cu 선폭 0.5~100μm)로 실험하고 문헌(Park 외 1999, 상용 화학 슬러리)과 비교했습니다. 폭 25μm 미만 피처에서는 슬러리 화학의 영향이 없었고, 폭 100μm의 넓은 Cu에서는 화학 슬러리가 디싱을 줄여 3분 오버폴리싱 시 450nm가 230nm로, 1분 오버폴리싱에서도 디싱이 0.65배('reduced by a factor of 0.65')가 됐다고 서술합니다.","lv":"심화","s":["d_cm3"],"q":{"t":"원논문 실험","v":"원문 확인","yr":"2001","cond":"본 실험은 pH 7 중성 슬러리, 비교 대상은 문헌의 상용 화학 슬러리(서로 다른 연구 간 비교). 넓은 Cu 영역(폭 100μm), 오버폴리싱 1~3분","cmp":"중성 슬러리(본 실험) 대 화학 슬러리(문헌 Park 외 1999)","lim":"2001년, 100mm 웨이퍼 학위논문. 서로 다른 연구 간 비교이며 현재 양산 CMP 성능이 아님","orig":"문헌(Park 외 1999)은 열람하지 않음"},"v":"원문 확인","lim":"2001년 학위논문 실험이며 현재 양산 CMP와 다름"},{"x":"하이브리드 본딩 Cu CMP 리뷰(J. Electron. Packag. 2025)에 디싱 목표 정확도를 0.5nm 이내, 변동을 1nm 이내로 제어하는 방안이 언급된다는 검색 발췌가 있으나, 유료 본문을 열람하지 못해 조건·근거를 확인하지 못했습니다. 양산 규격으로 읽으면 안 됩니다.","lv":"심화","s":["d_cm4"],"c":"불확실","q":{"t":"논문 서술","v":"미확인","yr":"2025","cond":"검색 발췌만 확인. 공정 조건·인용 출처 미확인"},"v":"미확인"},{"x":"연마 시간이 길어지면 슬러리와 패드 컨디셔닝 소재 소비도 늘어, 공정 단계 수는 비용과도 연결됩니다.","lv":"실무","s":["d_cm4"]}]},{"id":"defects","t":"품질·불량 메커니즘","items":[{"x":"디싱은 금속 라인 안쪽이 파이는 현상이고, 에로전은 패턴이 밀집한 영역에서 유전체(산화막)까지 함께 얇아지는 현상입니다. 하이브리드 본딩 문맥에서 Cu 디싱은 Cu 리세스, 에로전은 산화막 리세스와 같은 의미로 쓰입니다.","lv":"실무","s":["d_cm4"]},{"x":"금속과 배리어 사이의 갈바닉 부식으로 한쪽이 먼저 녹아 디싱·에로전이 커질 수 있습니다. 슬러리 첨가제(예: PAA-PEG 복합체)로 선택비는 높이고 디싱은 낮추려는 연구가 있습니다.","lv":"심화","s":["d_cm1"]},{"x":"스크래치는 입자와 패드 표면 돌기, 응집 입자가 웨이퍼와 소성 접촉할 때 생깁니다. 선진 로직에서 마이크로스크래치는 수율을 가장 크게 깎는 CMP 결함의 하나로 꼽히고, 패드 표면 자체와 후세정 브러시도 발생원으로 확인됐습니다.","lv":"심화","s":["d_cm6"]},{"x":"텅스텐 접점 CMP에서는 마이크로스크래치가 벌크 텅스텐 제거 단계에서 생겼습니다. 입자와 잔류막이 후속 건식 식각을 막아 개방(open) 불량을, 금속 조각이 누설을 일으키는 사례가 정리돼 있습니다.","lv":"심화","s":["d_cm5"]},{"x":"그 밖의 CMP 결함: 입자 부착, 슬러리 잔류물, 피팅(pitting), 부식, 막 박리.","lv":"실무","s":["d_cm2","d_cm1"]},{"x":"스크래치를 줄이는 가장 효과적인 방법은 더 작은 연마 입자로 보고되지만, 이 경우 선택비와 평탄도 제어가 어려워지고 연마 기구는 완전히 이해되지 않았다고 합니다.","lv":"심화","s":["d_cm6"]}]},{"id":"trend","t":"기술 발전 방향","items":[{"x":"하이브리드 본딩용 Cu CMP: 디싱 수 nm, 유전체 에로전 제어, 3단계 CMP 사용 시 슬러리·컨디셔닝 소재 소비 증가가 과제로 정리됩니다.","lv":"심화","s":["d_cm4"],"q":{"t":"논문 서술","v":"발췌 확인","yr":"2025","cond":"3단계 CMP의 소모품 증가 서술(검색 발췌). 구체 수치 없음"},"v":"발췌 확인"},{"x":"신규 금속(예: Mo) CMP: Mo와 Cu를 약알칼리 시트르산계 슬러리에서 연마하는 기구를 규명하는 연구가 보고됩니다.","lv":"심화","s":["d_cm7"]},{"x":"미세 연마 입자 슬러리, 패드·컨디셔닝 최적화, 브러시 세정 개선이 스크래치 저감의 방향으로 제시됩니다.","lv":"심화","s":["d_cm6"]},{"x":"HBM의 TSV 노출 CMP와 하이브리드 본딩용 CMP는 서재의 기존 해설이 다룬 방향이며, HBM 영역 설명과 연결됩니다.","lv":"산업"}]},{"id":"industry","t":"산업·기업 연계","items":[{"x":"CMP는 슬러리·패드·컨디셔너·후세정액 같은 소모품 비중이 큰 공정입니다. 소모품은 막 종류와 장비·공정 조건에 맞춰 승인되며, 한 번 승인되면 바꾸기 어렵다는 점은 일반론입니다.","lv":"산업"},{"x":"서재에서 CMP 품목은 FNSTech(패드), 솔브레인(슬러리 제품 포함), Qnity, FFEM 등의 책이 다룹니다. 연결은 품목 단위이며 점유율이나 고객 관계를 뜻하지 않습니다.","lv":"산업"},{"x":"CMP 시장 점유율은 기존 품목군 해설이 인용한 2019년 자료가 있으나 이번 PR에서 새로 확인한 수치가 아니므로 옮기지 않았습니다.","lv":"산업","c":"불확실"}]}],"unc":[{"x":"CMP 시장 점유와 서재 기업의 슬러리·패드 사양은 확인하지 못했습니다.","lv":"산업","c":"불확실"},{"x":"하이브리드 본딩 CMP 목표값(0.5nm 등)은 리뷰가 인용한 보고값이며 양산 규격이 아닙니다.","lv":"심화","c":"불확실","q":{"t":"논문 서술","v":"미확인","yr":"2025","cond":"검색 발췌만 확인. 공정 조건·인용 출처 미확인"},"v":"미확인"},{"x":"패드 수명·컨디셔닝의 정량 관계는 이번에 1차 출처를 확보하지 못했습니다.","lv":"실무","c":"불확실"}]},"hbm":{"n":"HBM 및 첨단 패키징","procs":["hbm","pkg"],"tx":["hbmfilm","substrate","pid","film","probe","cmp"],"intro":"TSV·본딩·언더필·열 관리를 단수 증가에 따른 수율·검사 난이도와 연결합니다.","sections":[{"id":"concept","t":"기본 개념","items":[{"x":"HBM(고대역폭 메모리)은 DRAM 여러 장을 수직으로 쌓아 실리콘 관통 전극(TSV)으로 잇고, 넓은 인터페이스로 GPU 같은 호스트 칩 옆에 붙이는 메모리입니다.","lv":"입문"},{"x":"JEDEC HBM 표준(HBM1·HBM2, JESD235D)은 HBM DRAM이 호스트 연산 다이에 밀접히 결합되고 인터페이스가 독립 채널로 나뉘며, 채널당 128비트 데이터 버스가 DDR로 동작하고 스택당 최대 8채널이 예상된다고 규정합니다. 스택 맨 아래에 신호 재분배용 인터페이스 다이를 둘 수 있습니다.","lv":"실무","s":["d_hb1"],"q":{"t":"일반화 가능 사실","v":"원문 확인","yr":"2021","cond":"JESD235D(HBM1·HBM2) 3절. 스택당 최대 8채널은 표준이 \"예상(anticipated)\"하는 값이며 DRAM 업체가 구성을 정함","cmp":"HBM1·HBM2 표준(HBM3 이후 아님)"},"v":"원문 확인"},{"x":"HBM4(JESD270-4, 2025-04 공표)는 2048비트 인터페이스, 핀당 최대 8Gb/s, 총 대역폭 최대 2TB/s, 채널 32개(채널당 의사 채널 2개), 4·8·12·16단, 24Gb/32Gb 다이, 최대 64GB 큐브(32Gb 16단)를 담았다고 JEDEC이 발표했습니다. 표준 본문이 아니라 보도자료 요약입니다.","lv":"실무","s":["d_hb2"],"q":{"t":"일반화 가능 사실","v":"원문 확인","yr":"2025","cond":"JEDEC 보도자료(2025-04-16) 본문. 표준 본문(JESD270-4)은 열람하지 않음","cmp":"HBM3(16채널) 대 HBM4(32채널)","lim":"표준 본문이 아니라 보도자료 요약. 상용 제품 사양과 같다는 뜻이 아님"},"v":"원문 확인"},{"x":"일반 메모리 패키지가 솔더볼(300~400μm)로 4~32개 I/O를 쓰는 것과 달리, HBM은 훨씬 작고 많은 마이크로범프로 메모리 다이와 SoC 사이에 넓은 대역을 만듭니다(SK hynix 논문의 설명).","lv":"실무","s":["d_hb3"],"q":{"t":"기업 발표","v":"원문 확인","yr":"2023","cond":"SK hynix 논문의 서술. 일반 메모리 패키지 4~32개 I/O·솔더볼 300~400μm 대 HBM","cmp":"일반 메모리 패키지 대 HBM 마이크로범프"},"v":"원문 확인"},{"x":"첨단 패키징 용어: 2.5D는 실리콘 인터포저 위에 GPU와 HBM을 나란히 올리는 방식, 3D는 칩을 수직으로 직접 쌓는 방식, 팬아웃은 칩 바깥으로 배선을 넓히는 방식입니다.","lv":"입문"}]},{"id":"mechanism","t":"동작 원리","items":[{"x":"TSV 공정 흐름: 깊은 구멍 식각 → 절연·배리어·시드 증착 → 구리 도금 → CMP → 뒷면 연삭으로 전극 노출. 증착·식각·CMP 영역 설명과 직접 연결됩니다.","lv":"실무"},{"x":"종횡비 10 이상인 TSV에서는 PVD·CVD가 한계에 이르고 ALD로 배리어·시드를 올리는 연구가 보고됩니다.","lv":"심화","s":["d_ald8"]},{"x":"2013년 연구의 HBM 패키징 흐름: 앞면 범핑 → 캐리어 글라스 접합 → 뒷면 범핑 → 캐리어 제거를 거치고, DRAM 코어 웨이퍼에는 비전도성 필름(NCF)을 라미네이션한다고 설명합니다(당시 구조, 현재 양산 흐름과 다를 수 있음).","lv":"실무","s":["d_hb9"],"lim":"2013년 연구 기준 구조. 현재 양산 흐름과 다를 수 있음"},{"x":"적층 본딩은 두 갈래입니다. TC-NCF는 비전도성 필름을 끼운 열압착, MR-MUF는 일괄 리플로우 뒤 몰디드 언더필(MUF)로 채우는 방식이며 둘 다 플립칩과 마이크로범프를 씁니다.","lv":"실무","s":["d_hb4"]},{"x":"SK hynix 논문은 MR-MUF가 적층 중 압력을 가하지 않아 TC-NCF보다 열 경로(thermal bump)를 더 만들 수 있고, MUF가 NCF보다 전도성 충진재를 넣기 쉬워 큐브의 열전도도를 높일 수 있다고 설명합니다(회사 방식에 대한 회사 발표).","lv":"심화","s":["d_hb3"],"c":"전망"},{"x":"하이브리드 본딩은 범프 없이 Cu-Cu 직접 접합으로 연속적인 열전도 경로를 만듭니다.","lv":"심화","s":["d_hb4"]}]},{"id":"materials","t":"핵심 소재·부품·장비","items":[{"x":"소재: 도금액, NCF, 언더필·EMC(몰딩 컴파운드), 내열 이형 필름, 임시 접착제와 캐리어, 마이크로범프용 Cu 필러·솔더. 서재의 HBM용 내열 필름 해설은 열압착 본딩에서 넘친 접착제가 툴에 묻지 않게 하는 용도를 설명합니다.","lv":"실무"},{"x":"적층 사이를 메우는 충진 소재의 열전도도는 높을수록 좋고, 전기적으로 절연되면서 열을 빼내는 경로를 만드는 설계가 필요하다고 보고됩니다. 이 특성은 충진 소재와 적층 방식에 좌우됩니다.","lv":"심화","s":["d_hb3"]},{"x":"장비: 딥 실리콘 식각기, 도금기, TC 본더, 리플로우·몰딩 장비, 하이브리드 본더(차세대), 프로브카드(적층 전 개별 다이 검증).","lv":"실무"},{"x":"패키지 기판, PID(감광성 절연재), 필름류는 서재의 기판·필름 품목군과 연결됩니다.","lv":"산업"}]},{"id":"params","t":"주요 공정 변수","items":[{"x":"TSV 개수는 HBM 세대마다 늘고, 피치와 범프 크기를 줄이면 적층 수율과 패키지 신뢰성에 큰 영향을 준다고 SK hynix 논문이 설명합니다.","lv":"심화","s":["d_hb3"]},{"x":"한 SK hynix ISSCC 2018 논문은 도입부에서 '적층 칩의 전체 수율은 TSV 하나의 수율을 TSV 개수만큼 거듭제곱한 값'이라고 설명하고, 8단 HBM에서 TSV 연결 하나가 실패하면 9개 다이가 버려지므로 TSV 수리 기술이 필수라고 말합니다. 이것은 단순 모델입니다. 개별 연결 불량이 서로 독립이고, 모든 연결이 정상이어야 하며, 수리·리던던시를 고려하지 않는다는 가정에 서 있고, 같은 논문이 TSV 자가 수리 회로를 제안해 이 가정을 완화합니다. 실제 HBM 수율에는 다이 수율, TSV, 범프·본딩, 테스트 등이 함께 작용하므로 이 식을 양산 수율 예측 공식으로 쓰면 안 됩니다.","lv":"심화","s":["d_hb5"],"q":{"t":"기업 발표","v":"원문 확인","yr":"2018","cond":"SK hynix 논문 도입부의 서술(8단 HBM2 사례). 실험 결과가 아니라 문제 설명용 단순 모델","lim":"양산 수율 예측식이 아님. 가정 3개는 모델의 수학적 전제를 편집자가 풀어 쓴 것"},"v":"원문 확인","as":["개별 TSV·범프 연결의 불량이 서로 독립이라고 가정","스택 안의 모든 연결이 정상이어야 양품이라고 가정(하나라도 불량이면 전체 불량)","TSV 수리·리던던시와 다이 단위 선별을 반영하지 않음(논문은 자가 수리로 이 가정을 완화)","다이 수율, 본딩·갭충진, 테스트 요인이 함께 작용하는 실제 수율을 설명하지 못함"]},{"x":"핵심 관리 변수: 본딩 온도·압력·정렬 정밀도, 범프 피치, TSV 수와 피치, 갭 충진 품질, 패키지 높이(z-height), 휨(warpage), 정션 온도.","lv":"실무"},{"x":"한 리뷰는 MR-MUF 같은 기존 방식이 내부 열저항을 낮추지만 없애지는 못하며, 열저항이 12단 이상 스택에서 급격히 커진다고 서술합니다.","lv":"심화","s":["d_hb4"],"q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2025","cond":"리뷰의 정성 서술(초록·본문). 구체 열저항 수치는 이 문장에 없음","cmp":"12단 이하 스택 대비 12단 이상(정성 서술)","orig":"리뷰가 인용한 원 논문은 열람하지 않음"},"v":"원문 확인"},{"x":"이 리뷰는 여러 연구를 종합해 하이브리드 본딩이 접합부 열저항을 22.8~47% 줄일 수 있다고 정리합니다. 상한 47%는 Mehta 외의 16단 HBM 열 시뮬레이션(마이크로범프 대비)을 리뷰가 인용한 값이고, 약 20%는 ECTC 2023의 16단 HBM4 Cu-Cu 하이브리드 본딩이 MR-MUF 대비 접합 열저항을 낮춘 값으로 리뷰가 소개합니다. 두 값은 비교 대상이 다르고 20% 사례가 시뮬레이션인지 측정인지 리뷰에 명시돼 있지 않습니다.","lv":"심화","s":["d_hb4"],"q":{"t":"시뮬레이션","v":"원문 확인","yr":"2025","cond":"47%: Mehta 외 16단 HBM 열 시뮬레이션(리뷰 인용). 20%: ECTC 2023 16단 HBM4 사례(시뮬레이션/측정 여부 리뷰에 없음)","cmp":"47%: 하이브리드 본딩 대 마이크로범프, 20%: 하이브리드 본딩 대 MR-MUF","lim":"리뷰가 재인용한 값. 양산 결과가 아님","orig":"Mehta 외·ECTC 2023 원 논문은 열람하지 않음"},"v":"원문 확인"},{"x":"전력 효율: SK hynix 논문은 HBM2E 약 4.3pJ/bit 대비 HBM3E는 20% 감소, HBM4는 60% 감소를 기대한다고 밝혔습니다(회사의 예상).","lv":"심화","s":["d_hb3"],"c":"전망","q":{"t":"기업 발표","v":"원문 확인","yr":"2023","cond":"SK hynix 논문 서술. HBM2E 약 4.3pJ/bit 대비 HBM3E 20%·HBM4 60% 감소. HBM4는 \"예상(expected)\"","cmp":"HBM2E 대비","lim":"회사의 예상이며 HBM4 실제 제품값이 아님"},"v":"원문 확인"}]},{"id":"defects","t":"품질·불량 메커니즘","items":[{"x":"TSV나 마이크로범프 하나의 개방·단락이 스택 전체의 불량이 되고, 적층 후에는 개별 다이를 교체할 수 없습니다.","lv":"심화","s":["d_hb5"]},{"x":"3차원 스택은 열을 가두고 열-기계 응력을 증폭합니다. 열 때문에 휨, 접합부 피로, 보이드 위험이 커집니다.","lv":"심화","s":["d_hb4"]},{"x":"고온·고압 본딩은 열응력으로 휨을 일으킬 수 있고, 압력 없는 방식은 열 경로 설계가 쉬워진다는 설명이 있습니다. 두 방식의 수율 우열은 제3자 검증이 필요한 사안입니다.","lv":"심화","s":["d_hb3"]},{"x":"검사 난이도: 적층 후에는 내부 접합부에 직접 접근할 수 없어, 적층 전 개별 다이 검증(KGD)과 적층 후 KGSD 검증이 필요합니다. HBM의 KGSD와 개별 다이 테스트는 비용, 병렬성, 테스트 품질 면에서 큰 과제로 정리됩니다.","lv":"심화","s":["d_ts1"]},{"x":"단수가 늘면 누적 수율 손실이 커지고, 검사해야 할 접합부 수가 많아져 검사 시간과 비용이 늘어납니다. 구체 수율 수치는 확인하지 못했습니다.","lv":"실무","c":"불확실"}]},{"id":"trend","t":"기술 발전 방향","items":[{"x":"HBM은 세대마다 대역폭과 용량을 2~3배 늘려 왔고, HBM4 이후는 전력 밀도가 높아져 열 관리가 중요해진다고 IEEE ECTC 2025 초록이 설명합니다.","lv":"심화","s":["d_hb6"],"q":{"t":"논문 서술","v":"발췌 확인","yr":"2025","cond":"IEEE ECTC 2025 초록의 서술(검색 발췌). 세대별 구체값 없음","lim":"초록만 확인","cmp":"이전 세대 대비"},"v":"발췌 확인"},{"x":"16단 이상에서는 칩-투-웨이퍼 하이브리드 본딩이 갭 충진재를 없애 높이 제한 안에서 더 많은 다이를 쌓고 방열도 제어할 수 있다고 SK hynix 논문은 전망합니다(회사 전망).","lv":"심화","s":["d_hb3"],"c":"전망","q":{"t":"기업 발표","v":"원문 확인","yr":"2023","cond":"SK hynix 논문의 서술. 16단 이상에서 칩-투-웨이퍼 하이브리드 본딩의 높이·방열 이점(표 3은 추출되지 않아 확인 못함)","lim":"회사의 전망","cmp":"기존 갭 충진 방식 대비"},"v":"원문 확인"},{"x":"하이브리드 본딩 공정 흐름 두 가지가 비교됩니다. 양면 패드 형성(DSF)과 칩 사이 갭 충진(IDGF)이며, IDGF는 몰딩이 필요 없고 더 얇은 칩을 써 같은 두께에 더 많은 칩을 쌓을 수 있다고 합니다.","lv":"심화","s":["d_hb6"]},{"x":"하이브리드 본딩은 Cu CMP 요구(디싱 수 nm)를 함께 끌어올립니다. CMP 영역 설명과 연결됩니다.","lv":"심화","s":["d_cm4"]},{"x":"회사별 방식 차이에 관한 보도(2024-03)에 따르면 삼성전자는 HBM에는 TC-NCF를 유지하고 MUF는 서버용 3DS RDIMM에 검토했다고 하지만, 익명 소식통 보도이며 회사 확인이 없고 이후 변경됐을 수 있습니다.","lv":"산업","s":["d_hb8"],"c":"불확실"}]},{"id":"industry","t":"산업·기업 연계","items":[{"x":"HBM 공급망은 메모리 제조사, 패키징·본딩 장비, 소재(NCF·언더필·EMC·필름), 기판·인터포저, 프로브카드를 포함한 테스트로 이어집니다.","lv":"산업"},{"x":"서재에서 HBM 영역과 연결된 품목은 내열 필름(AMMK), CMP(패드·슬러리), 프로브카드(TSE·피엠티), 기판(삼성전기·심텍), PID·필름(LG화학) 등입니다. 연결은 품목 단위이며 HBM 공급 여부나 점유율을 뜻하지 않습니다.","lv":"산업"},{"x":"고객사 인증과 공급 관계는 확인된 자료가 없어 서술하지 않습니다.","lv":"산업","c":"불확실"}]}],"unc":[{"x":"HBM3·HBM3E 표준 원문은 열람하지 못했고, HBM4는 보도자료 요약만 확인했습니다.","lv":"실무","c":"불확실"},{"x":"MR-MUF와 TC-NCF의 수율·열 성능 우열은 회사 논문과 익명 보도 외 제3자 비교를 확인하지 못했습니다. 제3자 분석 매체(Nomad Semi)의 정량 주장(수율 차이, HBM4 패키지 높이 규격 조정 등)은 원 출처를 확인하지 못해 쓰지 않았습니다.","lv":"심화","s":["d_hb7"],"c":"불확실"},{"x":"하이브리드 본딩의 HBM 양산 적용 시점은 확인하지 못했습니다. 열저항 개선 수치는 시뮬레이션과 연구 보고값입니다.","lv":"심화","c":"불확실"},{"x":"SK hynix 2023 논문은 HBM4가 12Gbps 이상의 I/O 속도와 16단 이상을 요구한다고 쓰지만, JEDEC 2025 보도자료는 HBM4 전송 속도를 최대 8Gb/s로 발표해 서로 다릅니다. 이 문서는 표준 수치는 JEDEC 발표만 쓰며, 세대별 속도는 표준 본문으로 재확인해야 합니다.","lv":"심화","c":"불확실","s":["d_hb3","d_hb2"],"v":"원문 확인","q":{"t":"기업 발표","v":"원문 확인","yr":"2023","cond":"2023년 회사 논문의 요구 사양(전망) 대 2025년 표준 발표(최대 8Gb/s)","cmp":"SK hynix 2023 논문 대 JEDEC 2025 보도자료"}}]},"test":{"n":"반도체 테스트","procs":["test"],"tx":["probe","socket","wtester","ptester","handler"],"intro":"프로브카드·ATE·KGD를 중심으로 웨이퍼·패키지 테스트의 원리와 한계를 설명합니다.","sections":[{"id":"concept","t":"기본 개념","items":[{"x":"테스트는 전기 신호로 칩의 양품·불량과 성능 등급을 가르는 공정입니다. 웨이퍼 단계(프로브), 패키지 단계(최종 테스트), 번인, 시스템 레벨 테스트로 이어집니다.","lv":"입문"},{"x":"프로브카드는 시험 대상 칩(DUT)과 자동 테스트 장비(ATE)의 테스트 헤드 사이의 인터페이스입니다. 웨이퍼 한 번 테스트에 1,000개가 넘는 칩 접점을 ATE 회로와 연결해야 한다고 한 특허의 배경 설명은 적습니다.","lv":"실무","s":["d_ts3"],"q":{"t":"특허 실시예","v":"발췌 확인","yr":"2010","cond":"특허 배경 서술(웨이퍼 레벨 시험 일반 설명). 원문 PDF 접근 실패, 검색 발췌만 확인","lim":"특허 배경은 출원인의 서술이며 업계 표준값이 아님"},"v":"발췌 확인","lim":"특허 배경 서술"},{"x":"KGD(Known Good Die)는 패키징 전에 양품으로 판정한 칩입니다. 불량 칩을 패키징 전에 가려 후공정 비용을 줄이는 목적입니다.","lv":"입문","s":["d_ts3","d_ts4"],"lim":"오래된 자료(2010년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"모듈 테스트는 다이·웨이퍼 테스트 뒤에, 최종 테스트 앞에 놓입니다.","lv":"실무","s":["d_ts1"]}]},{"id":"mechanism","t":"동작 원리","items":[{"x":"프로브카드는 크게 캔틸레버/에폭시형, MEMS형, 수직형, 수직 MEMS형으로 분류됩니다.","lv":"실무","s":["d_ts4"]},{"x":"캔틸레버형은 카드 표면과 평행하게 붙었다가 위로 휘어 올라오는 금속 스프링 핑거를, 수직형은 상단이 고정된 수직 금속 바늘을 씁니다.","lv":"실무","s":["d_ts3"],"lim":"오래된 자료(2010년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"효율을 위해 웨이퍼 전체를 한 번의 접촉(터치다운)으로 병렬 테스트하는 것이 이상적입니다. 접점이 한 번에 맞지 않으면 터치다운이 반복되어 시간과 비용이 늘어납니다.","lv":"실무","s":["d_ts3"],"lim":"오래된 자료(2010년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"웨이퍼 레벨 번인은 일정 시간 동안 칩에 전원을 인가해 초기 불량을 가려내는 방식이며, IDDq 시험 등이 포함될 수 있습니다.","lv":"실무","s":["d_ts5"]},{"x":"HBM 같은 적층 메모리는 개별 다이의 마이크로범프 사이에 테스트 패드를 두면 기존 DRAM 프로브카드와 테스터로 고병렬 웨이퍼 테스트를 쓸 수 있습니다. 설계 시 테스트 용이성(DFT)과 수리·리던던시를 함께 쓰면 경제적이라고 IEEE 가이드가 설명합니다.","lv":"심화","s":["d_ts2"]},{"x":"패키지 테스트에서는 핸들러가 칩을 소켓에 넣고 속도·온도 조건별로 측정하며, 번인 소터와 보드가 고온·고전압 선별을 담당합니다. 이 부분은 이번에 별도 출처를 확보하지 못해 기존 해설을 따릅니다.","lv":"실무"}]},{"id":"materials","t":"핵심 소재·부품·장비","items":[{"x":"프로브카드는 회로기판(PCB)과 탐침을 모은 프로브 헤드로 구성됩니다.","lv":"실무","s":["d_ts3"],"lim":"오래된 자료(2010년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"소모성 부품: 테스트 소켓, 인터페이스(로드) 보드, 번인 보드. 테스트 장비: 메모리·SoC 테스터, 프로버, 핸들러, 번인 장비, SLT 장비.","lv":"실무"},{"x":"테스트는 재료보다 소모성 부품과 장비 중심의 공정입니다. 소모품은 교체 주기가 있어 반복 수요가 생깁니다.","lv":"산업"}]},{"id":"params","t":"주요 공정 변수","items":[{"x":"프로브 피치: 특허 실시예에서 탐침 피치는 약 40μm 수준으로 제시됩니다(특정 설계의 예이며 업계 표준값이 아님). 한편 IEEE 가이드는 마이크로범프 사이에 둔 40×50μm 크기의 알루미늄 테스트 패드를 예로 들고, 2014년 연구가 40/50μm 피치 Wide-I/O DRAM에서 직접 마이크로범프 프로빙이 경제적이며 테스트 시간이 10배 줄었다고 보고했다고 재인용합니다.","lv":"심화","s":["d_ts5","d_ts2"],"q":{"t":"특허 실시예","v":"발췌 확인","yr":"2014","cond":"특허 실시예(약 40μm 피치)와 IEEE 가이드의 예시(40×50μm 테스트 패드, 2014년 Wide-I/O 40/50μm 피치 연구 재인용)","cmp":"직접 마이크로범프 프로빙 대 기존 방식(재인용 문장)","lim":"특허 실시예·재인용 값이며 업계 일반값이 아님","orig":"특허 PDF는 접근 실패, 2014년 연구 원문은 열람하지 않음"},"v":"발췌 확인","lim":"특허 실시예와 재인용 값"},{"x":"미세 피치 접촉에서는 스프링인 탐침이 전기적 요구뿐 아니라 오버트래블(과구동) 순응성까지 만족해야 한다고 정리됩니다.","lv":"심화","s":["d_ts2"]},{"x":"병렬도(동시에 측정하는 DUT 수)는 비용을 좌우합니다. 광대역 갭 전력반도체 문맥에서는 4~16개 사이트를 중간 병렬 수준으로 분류합니다(메모리 기준 값이 아님).","lv":"심화","s":["d_ts4"],"q":{"t":"리뷰 재인용","v":"원문 확인","yr":"2026","cond":"광대역 갭 전력반도체(자동차·고신뢰성), 전류 약 50~200A 수준의 중간 병렬 시험","cmp":"웨이퍼 레벨 선별 대 중간 병렬 시험","lim":"전력반도체 맥락이며 메모리·HBM 시험 병렬도가 아님"},"v":"원문 확인"},{"x":"메모리 테스트는 높은 인터페이스 속도, 전력, 열 관리 요구에 대응해야 합니다.","lv":"심화","s":["d_ts1"]},{"x":"그 밖의 변수: 접촉 저항, 테스트 온도 범위, 신호 무결성, 테스트 시간·원가. 서재 프로브카드 해설의 '-40~150℃' 같은 수치는 기존 내용으로 이번 PR에서 출처를 확보하지 못했습니다.","lv":"실무","c":"불확실","q":{"t":"논문 서술","v":"미확인","yr":"2026","cond":"서재 프로브카드 기존 해설의 '-40~150℃'는 이번 PR에서 출처를 연결하지 못함"},"v":"미확인"}]},{"id":"defects","t":"품질·불량 메커니즘","items":[{"x":"접촉 문제: 비평탄한 프로브 핑거는 한 번에 테스트할 수 있는 웨이퍼 크기를 제한하고 터치다운 횟수를 늘립니다.","lv":"심화","s":["d_ts3"],"lim":"오래된 자료(2010년)이며 현재 양산 조건·설계와 다를 수 있음"},{"x":"미세 피치 범프를 직접 프로빙하면 경제적으로 어렵고 후속 범프 접합에 위험을 줄 수 있어, 프로브 피치와 패키징 피치를 분리하는 접근이 권장됩니다.","lv":"심화","s":["d_ts2"]},{"x":"칩렛 구조에서 패시브 인터포저는 KGD가 아닐 수 있고 제조 결함을 완전히 선별하기 어렵거나 불가능한 경우가 있습니다.","lv":"심화","s":["d_ts2"],"v":"원문 확인"},{"x":"적층 메모리(HBM)에서는 KGSD와 개별 다이 테스트가 비용, 병렬성, 테스트 품질에서 큰 과제입니다. 적층 후 불량이면 다이 전체를 버리므로(HBM 영역 설명) 적층 전 검증 품질이 곧 수율입니다.","lv":"심화","s":["d_ts1","d_hb5"],"v":"원문 확인"},{"x":"광대역 갭 전력반도체에서는 웨이퍼 레벨 테스트가 가혹한 고전압·고전류 조건을 다 재현하지 못해 개별화된 다이의 KGD 테스트가 필요하다고 설명합니다(전력반도체 문맥).","lv":"심화","s":["d_ts4"]},{"x":"테스트 이스케이프(불량 유출)와 과검(양품 폐기)은 커버리지와 규격의 교환 관계입니다. 이 일반 원리는 별도 출처를 붙이지 않았습니다.","lv":"실무"}]},{"id":"trend","t":"기술 발전 방향","items":[{"x":"칩렛 상호연결의 미세 피치 때문에 웨이퍼 소트에서 전통적 프로빙이 곤란하거나 불가능해지고, 패키지 안에서는 베이스 다이의 패키지 핀으로만 접근해야 하는 경우가 생깁니다.","lv":"심화","s":["d_ts1"],"v":"원문 확인"},{"x":"2.5D/3D에서는 웨이퍼 프로브 품질을 높여 최종 테스트 불량을 줄이는 KGD용 DFT 방법이 필요하다고 로드맵이 지적합니다.","lv":"심화","s":["d_ts1"],"v":"원문 확인"},{"x":"최신 MEMS 수직 프로브 어레이는 미세 피치 마이크로범프에도 접촉할 수 있으나, 프로브 피치가 패키징 피치를 따라가지 않도록 설계하는 것이 중요하다고 정리됩니다. 가장 촘촘한 피치를 안정적으로 접촉하는 프로브카드 업체는 소수라고 IEEE 가이드가 기술합니다(해당 문서의 서술).","lv":"산업","s":["d_ts2"],"c":"전망","v":"원문 확인"},{"x":"SLT 확대, AI 기반 테스트 최적화는 기존 해설이 다룬 방향이며 이번에 출처를 확보하지 못했습니다.","lv":"심화","c":"불확실"}]},{"id":"industry","t":"산업·기업 연계","items":[{"x":"테스트 공급망: ATE(테스터) 업체, 프로버, 프로브카드, 소켓·보드, 핸들러·번인 장비로 나뉩니다.","lv":"산업"},{"x":"서재에서 테스트 영역과 연결된 책은 프로브카드(TSE·피엠티), 소켓·보드(TSE), 웨이퍼 테스터(와이씨), 패키지 테스터(엑시콘), 번인 소터·핸들러(제이티)입니다. 연결은 품목 단위이며 공급 관계나 점유율을 뜻하지 않습니다.","lv":"산업"},{"x":"미세 피치 프로브카드를 안정적으로 공급하는 업체가 소수라는 서술이 있으나, 서재 속 어느 기업이 여기에 해당하는지는 확인된 자료가 없어 판단하지 않습니다.","lv":"산업","c":"불확실"}]}],"unc":[{"x":"핸들러·소켓·번인 장비의 기술 설명은 1차 출처를 확보하지 못해 기존 해설에 의존합니다.","lv":"실무","c":"불확실"},{"x":"프로브카드 피치·수명·온도 수치는 특허 실시예 수준이며 업계 표준값이 아닙니다.","lv":"심화","c":"불확실"},{"x":"HBM 적층 후 테스트 구조의 세부는 로드맵 수준의 서술만 확인했습니다.","lv":"심화","c":"불확실"}]}},"corrections":[{"target":"TX.pre.h","old":"한 사이클에 원자 1층 두께(약 0.1nm)씩 막을 쌓습니다. 표면에서만 반응하는 자기제한 반응이라 깊은 홈 안쪽까지 두께가 균일합니다.","new":"사이클마다 아주 얇은 막(보통 한 원자층 이하)을 쌓습니다. 표면 반응 자리가 차면 더 쌓이지 않는 자기제한 반응이라, 전구체 노출이 충분한 조건에서는 깊은 홈 안쪽까지 두께가 고르게 쌓입니다. 노출이 부족하거나 CVD성 반응이 섞이면 깊이에 따라 달라집니다.","reason":"GPC를 한 단분자층(약 0.1nm)과 같다고 쓴 것은 과도한 단순화이며(Al₂O₃ TMA/H₂O 사례에서 OH 자리 7~9/nm² 대 사이클당 Al 약 4.5/nm²), 균일 피복도 노출량과 CVD 성분에 따라 보장되지 않음","src":["d_ald1"]},{"target":"PROC.dep.how","old":"ALD: 전구체와 반응가스를 번갈아 넣어 원자층 단위로 쌓음. 깊은 홈도 균일","new":"ALD: 전구체와 반응가스를 번갈아 넣어 사이클마다 얇게 쌓음. 깊은 홈도 비교적 고르게 덮이지만 노출량·반응물 조건에 따라 달라짐","reason":"'깊은 홈도 균일'은 조건과 무관한 보장처럼 읽혀, 코팅 가능한 종횡비가 구조·조건에 따라 5:1~1750:1로 다르게 보고됨","src":["d_ald1"]}],"legacyNum":[{"where":"PROC.wafer.iss","text":"300mm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"PROC.wafer.iss","text":"450mm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"PROC.diff.how","text":"1,000℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"PROC.hbm.how","text":"16단","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"PROC.hbm.fut","text":"16단","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pre.k","text":"99.9999%","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pre.k","text":"6N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pre.r","text":"2nm","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pre.r","text":"10nm","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pre.r","text":"300단","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.etch.h","text":"수백 대 1","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.etch.k","text":"1조분의","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.gasEtch.k","text":"5N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.gasEtch.k","text":"6N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.pr.k","text":"248nm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"TX.pr.k","text":"193nm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"TX.pr.k","text":"13.5nm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"TX.barc.h","text":"1%","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.wafer.w","text":"11N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.wafer.w","text":"99.999999999%","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.wafer.h","text":"0.775mm","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.wafer.k","text":"300mm","status":"미검증","kind":"교과서 수준 일반 상식(이번 PR에서 원문 대조 안 함)"},{"where":"TX.hbmfilm.k","text":"250℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.hbmfilm.r","text":"12단","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.hbmfilm.r","text":"16단","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.target.k","text":"5N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.target.k","text":"6N","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.alcap.k","text":"125~150℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.probe.k","text":"40~150℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.quartz.h","text":"1,000℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.oring.k","text":"300℃","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"},{"where":"TX.upw.h","text":"1ppb","status":"미검증","kind":"출처가 연결되지 않은 기존 수치"}],"notes":{"proc:clean":"서재의 제품 기술 '장비 부품 세정·코팅'(clean)은 챔버 부품을 씻고 코팅하는 사업(한솔아이원스, 에이텍솔루션의 부품 정밀세정)으로, 웨이퍼 세정 공정(SC1·DHF 등)에 투입되는 약액·재료와 다릅니다. 이 공정 페이지에는 두 기술이 함께 연결돼 있으나 부품 세정은 세정 공정의 장비·부품을 유지하는 서비스입니다. 연결 구조의 분리는 후속 수정 대상입니다.","tx:clean":"이 기술은 장비 부품의 정밀세정·코팅(서비스)입니다. 웨이퍼를 씻는 세정 공정 재료가 아닙니다. 웨이퍼 세정 공정(세정 페이지)에 연결돼 있는 것은 기존 공정 지도 구조 때문이며 분리는 후속 수정 대상입니다. 에이텍솔루션의 부품 정밀세정 사업 연결은 보존합니다."}};
